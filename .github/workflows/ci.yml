name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"

jobs:
  quality:
    name: lint · types · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check
        run: python -m mypy
        continue-on-error: true   # advisory until the codebase is fully annotated

      - name: Packaging guards
        # Catches the class of bug that once shipped a broken repo: a .gitignore pattern
        # silently excluding a source package from every commit.
        run: python -m pytest tests/unit/test_packaging.py -q

      - name: Unit tests
        run: python -m pytest tests/unit -q -m "not slow"

  data:
    name: dataset integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch UIT-VSFC
        run: python -m vifeedback.cli data fetch

      - name: Integrity suite
        # Asserts split sizes 11,426 / 1,583 / 3,166, label ranges, cross-split leakage and the
        # class-distribution snapshot. Fails loudly if upstream data ever changes.
        run: python -m pytest tests/data -q

  api:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime deps only
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "onnxruntime>=1.19" "fastapi>=0.115" httpx pytest

      - name: Contract tests
        run: python -m pytest tests/contract -q

  docker:
    name: image build · smoke test
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vifeedback:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: |
          SIZE=$(docker image inspect vifeedback:ci --format='{{.Size}}')
          MB=$((SIZE / 1000000))
          echo "image size: ${MB} MB (target <= 700, limit 1200)"
          test "$MB" -le 1200 || { echo "::error::image exceeds the S8 limit of 1200 MB"; exit 1; }

      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 vifeedback:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz && break || sleep 2
          done
          echo "--- healthz ---"; curl -sf http://localhost:8000/healthz
          echo "--- version ---"; curl -sf http://localhost:8000/version
          echo "--- readyz (expected ready=false: no model is baked into the image) ---"
          curl -s http://localhost:8000/readyz
          docker logs api
          docker rm -f api
