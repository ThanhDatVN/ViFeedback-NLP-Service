# Cycle 1 — declared 2026-09-27, before any Cycle 1 run started.
#
# Hypotheses are chosen from Cycle 0 evidence (results/studies/README.md), per review task 5:
# "select three primary hypotheses and launch only the controls needed to answer them".
# Changing a criterion below after results are seen requires a new file version and an ADR.

version: 2
declared: 2026-09-27
revisions:
  - version: 2
    date: 2026-09-27
    change: >
      Added H4 (shared sentiment/topic encoder, E07 / Study D). The review lists it in its
      recommended starting point and in its example Cycle 1 allocation; version 1 omitted it,
      found by the compliance audit (docs/REVIEW_COMPLIANCE.md). Declared before any H4 run.
    budget_change: >
      Finalist seeds move from per-hypothesis allowances to one shared pool of 4. Known when this
      was written: cRT does not meet its advance rule (+0.0028 mean). Not yet computed or looked
      at: the logit-adjustment and augmentation decisions. H1-H3 criteria are unchanged.
    adr: ADR-021
budget:
  weight_updating_runs: 30          # review § 10: Cycle 1 <= 30 full fine-tuning runs
  allocation:
    H1_imbalance: 6                 # 2 methods x 3 seeds (done)
    H2_augmentation: 3              # 3 seeds
    H3_xlmr_input: 10               # Kaggle: 5 raw + 5 pyvi re-run in the same session
    H4_multitask: 6                 # lambda in {0.3, 1} x 3 seeds
    finalist_pool: 4                # at most 2 finalists x 2 extra seeds, any hypothesis
    reserve: 1
  gpu_minutes_estimate: {laptop_rtx3050: 105, kaggle_t4: 65}

common:
  task: sentiment
  model: phobert-base
  preprocessing: seg_pyvi           # the deployed configuration
  epochs: 4
  lr: 2.0e-5
  batch_size: 32
  max_length: 96
  selection: dev macro-F1, per epoch (unchanged)
  run_id_phase: 8                   # Cycle 1 runs are p8-...; earlier phases keep their ids
  split: validation                 # test is untouched in Cycle 1 until the closing gate
  pilot_seeds: [42, 1337, 2024]
  finalist_seeds: [7, 31337]
  evaluation_precision_note: >
    Dev metrics are computed in fp16, like every registry row. fp16 vs fp32 flips one tied
    neutral example on the seed-42 checkpoint (0.8634 vs 0.8672), so single-seed differences
    below ~0.004 are not interpretable.

hypotheses:
  H1_imbalance:
    question: Is the neutral gap in the classifier (fixable without the representation) or not?
    evidence: >
      Study A: a post-hoc neutral bias tuned on OOF moves dev macro-F1 by +0.004 (noise-sized);
      66-72% of neutral errors are confident. Prediction: both methods change macro-F1 by
      < 0.01; neutral recall rises while neutral precision falls.
    control: base recipe (CE); reproduced as stage 1 of every cRT run at the same seed
    conditions:
      logit_adjust: {recipe: logit-adjust, logit_adjust_tau: 1.0}
      crt: {recipe: crt, crt_epochs: 10, crt_lr: 1.0e-3}    # Kang et al. 2020, balanced sampling
    advance_to_5_seeds_if: mean paired delta macro-F1 >= +0.005 and b wins >= 2 of 3 seeds
    supported_if: after 5 seeds, seed-paired 95% CI of delta macro-F1 excludes 0 (BH across the family)
    always_report: neutral precision / recall / F1 per seed; stage-1 CE reproduction vs registry

  H2_augmentation:
    question: Does diacritic/teencode augmentation buy robustness without costing clean accuracy?
    evidence: >
      Robustness suite v1: nodiacritic-50 costs -0.211 macro-F1; nodiacritic -0.595 with
      predictions collapsing into neutral.
    control: stage 1 (CE) of the H1 cRT runs, same seeds, robustness measured in-run
    condition: {recipe: aug-diac-teen, augment: diac-teen, augment_p: 0.3}
    primary: >
      relative reduction of the nodiacritic-50 degradation (clean minus shifted macro-F1),
      treatment vs control, averaged over seeds
    supported_if: relative reduction >= 20% AND mean paired clean macro-F1 loss <= 0.005
    secondary: [nodiacritic, teencode-100, charnoise-5]
    caveat: >
      Augmentation draws on the same transformation family as nodiacritic-50 and teencode-100,
      so those are in-family. charnoise-5 is never used in training and is the out-of-family check.

  H3_xlmr_input:
    question: Was XLM-R's -0.024 against PhoBERT (ADR-016) a model effect or a preprocessing penalty?
    evidence: ADR-019 — XLM-R was only ever given pyvi-segmented input, which it never saw in pretraining.
    where: Kaggle (full-embedding XLM-R exceeds the 4.29 GB laptop GPU); notebooks/kaggle_train.ipynb § 4e
    conditions:
      xlmr_raw: {model: xlmr-base, preprocessing: raw, seeds: all}
      xlmr_pyvi_rerun: {model: xlmr-base, preprocessing: seg_pyvi, seeds: all}   # same session, paired
    supported_if: seed-paired delta (raw - pyvi) > 0 with 95% CI excluding 0
    follow_up: >
      If xlmr_raw closes at least half of the gap to phobert-base + pyvi (i.e. reaches >= 0.8523),
      ADR-016's multilingual conclusion was mostly a confound and is withdrawn, not just narrowed.

  H4_multitask:
    question: Do sentiment and topic share useful structure, or interfere? (review Q4, E07, Study D)
    evidence: >
      Data card: Cramer's V(sentiment, topic) = 0.344; facility is 95.6% negative. Topic is the
      weaker task (0.811 dev) and has had no intervention.
    model: one phobert-base encoder, two heads of the single-task head architecture
    loss: L = L_sentiment + lambda * L_topic
    conditions:
      mtl_0.3: {recipe: mtl-l0.3, lambda: 0.3}
      mtl_1: {recipe: mtl-l1, lambda: 1.0}
    selection: epoch maximizing the MEAN of dev sentiment and dev topic macro-F1
    controls: >
      single-task phobert-base + pyvi, base recipe, same seeds (registry P4 rows). Valid as
      controls because Cycle 1 stage-1 runs reproduce those rows exactly under the current code.
    primary: per task, seed-paired delta macro-F1 (multi-task minus single-task)
    report: [both task macro-F1, neutral F1, others F1, joint exact match, parameters, training time]
    decision:
      helps: one task mean delta >= +0.005 with >= 2 of 3 wins AND the other task mean delta >= -0.005
      negative_transfer: any task mean delta <= -0.005 with <= 1 of 3 wins
      no_material_difference: >
        both |mean delta| < 0.005. Not an equivalence claim; the engineering reading is one model
        serving both tasks at half the inference cost with no loss detected at 3 seeds.
    advance_to_5_seeds_if: helps (draws on finalist_pool)

closing_gate:
  after: all H1-H3 decisions recorded
  test_evaluations: 1 per finalist configuration, logged, with --reason
  calibration: temperature fitted on validation, applied once to test (E09 confirmation)
