# Cycle 5 — declared 2026-09-29, before any Cycle 5 run (NEXT_PLAN v6).
#
# The owner chose the order (b) -> (a) -> (c):
#   H10 (b) robustness to real typing: consistency training on ViLexNorm pairs. Declared below.
#   H11 (a) a distilled student for S7 (<= 200 MB). Declared in version 2, below.
#   H12 (c) other institutions. Planned; needs the owner's label-policy decision (NEXT_PLAN v6 § 8,
#           decision 2) and new labelled data, because NEU-ESC test is spent (ADR-033, ADR-034).
#
# Seen before this was written: the ViLexNorm test flip rates of the CE and augmented recipes at 5
# seeds (Cycle 3: 17%, augmentation no help, p = 0.93) and the S2a gate on ViLexNorm test (lexicon
# from ViLexNorm train: 0.169 -> 0.177, p = 0.13). Not seen: any model trained with a consistency
# loss, any number on the ViLexNorm development split defined below. Changing a rule after its
# results are seen needs a new version and an ADR.
#
# Version 2 (2026-09-30), while H10's runs were in progress and before any H11 run or any H10
# decision: H11 declared. Its teacher is fixed by a rule written here, not by looking at H10's
# numbers: H10's recipe if H10 passes, otherwise the served recipe. No H10 rule changes.
#
# Version 3 (2026-09-30), after H11 passed (ADR-039) and before any latency number of the candidate
# or any UIT-VSFC test evaluation of a student: how the candidate replaces the served model, and its
# closing gate. The owner waived the idle-machine condition of the latency sessions.
#
# Version 4 (2026-09-30), after H10 failed (ADR-038) and before any H10b run: H10b, consistency
# anchored on a frozen teacher, with the three changes ADR-038 named: a target a constant prediction
# cannot match, a guard on the predicted class distribution, and fresh confirmation pairs.
#
# Version 5 (2026-10-01), after H10b passed (ADR-042) and before any H10b model saw UIT-VSFC test:
# its release candidate and its closing gate. Which model the service runs stays the owner's call.
#
# Version 6 (2026-10-01), after decision 9 served H10b (ADR-043) and before the held-out split below
# is drawn or any H12' run: H12', a substitute for H12 that needs no new labels, approved by the
# owner. Seen before this was written: H8's scores (ADR-033), which trained on all of in-scope NEU-ESC
# train; H11's soft labels, which are the served recipe's predictions on NEU-ESC train text, cached by
# the SHA-1 of the text and never compared with its labels. Not seen: any model's score on any part
# of NEU-ESC train.
#
# Version 7 (2026-10-01), after decision 9 served the 540 MB H10b graph and before any trimmed graph
# exists: S7b, the served model under 200 MB by FP16 storage and a vocabulary cut to the pieces of
# its training and coverage texts. Seen before this was written: the count of distinct PhoBERT pieces
# in those texts (15,566 of 64,000; no held-out text was tokenized). Not seen: anything on the
# held-out sets below.

version: 7
declared: 2026-09-29
revised: 2026-10-01  # v2 H11; v3 H11 release; v4 H10b; v5 H10b release candidate and closing gate; v6 H12'; v7 S7b

data:
  vilexnorm_train: >
    8,372 pairs (a real social-media comment and its human normalization). Split once, before any
    run: rows ordered by numpy.random.default_rng(42).permutation(8372); the first 837 are the
    development split, the other 7,535 the consistency-training pairs. The row indices are written
    to results/studies/cycle5/vilexnorm_dev_index.csv (indices only, no text).
  vilexnorm_dev: every H10 selection (recipe)
  vilexnorm_test: >
    Confirmation, 1,045 pairs, once per rule. Disclosed earlier uses: the Cycle 3 measurement and the
    S2a development gate (both on models without a consistency loss). Every Cycle 5 use is appended
    to results/studies/cycle5/vilexnorm_test_uses.log with the date, the rule and the models.
  uit_vsfc_validation: epoch selection (as in the served recipe) and non-inferiority
  neu_esc_validation: a non-inferiority guard (in-scope topics, 3,026 posts)
  uit_vsfc_test: not used by H10
  neu_esc_test: not used (spent)
  text: >
    ViLexNorm and NEU-ESC text goes through the service's own transform, serving.pipeline.prepare
    (lowercase NFC, the released diacritic restorer, pyvi), in training and in evaluation. UIT-VSFC
    keeps the materialized seg_pyvi variant, as every earlier run did.
  licence: >
    ViLexNorm is CC BY-NC-SA 4.0. A released H10 model is trained on it, so its weights would carry
    CC BY-NC-SA 4.0; releasing it to the Hub needs the owner's decision (HUONG_DAN_THU_CONG.md § 4).

H10_real_typing_consistency:
  question: >
    Does training the served recipe to give a real comment and its normalized form the same
    prediction reduce label flips on real typing, at no material cost on UIT-VSFC and NEU-ESC?
  why: >
    17% of ViLexNorm test labels flip between a comment and its normalization. A spelling lexicon
    (S2a) and synthetic augmentation (H2) did not reduce it: the instability is not spelling alone.
    Consistency training on real noisy/clean pairs targets it directly; UDA shows the quality of the
    noise pair is what matters [NEXT_PLAN v6 S11], and R-Drop / stability training give the loss
    [S12, S13].
  control: >
    The served recipe (PhoBERT-base, seg_pyvi, diac-teen augmentation p = 0.3, 4 epochs, lr 2e-5),
    seeds 42, 1337, 2024, 7, 31337: the existing checkpoints p9 (s42) and p10 (the others),
    re-evaluated with the same code as the candidates.
  recipes:
    consistency_onesided: >
      The served recipe plus, at every step, a batch of consistency-training pairs of the same size:
      loss = cross-entropy on UIT-VSFC + 1.0 * KL(p(normalized) || p(original)), with no gradient
      through p(normalized). The normalized form is closer to UIT-VSFC's text, so it is the target.
    consistency_symmetric: >
      The same, with the bidirectional KL of R-Drop: 0.5 * (KL(p(n) || p(o)) + KL(p(o) || p(n))),
      gradients through both forms.
  epoch_selection: UIT-VSFC validation macro-F1, as the served recipe
  recipe_selection: >
    Each recipe runs once at seed 42. Eligible: UIT-VSFC validation macro-F1 at least the control's
    seed-42 value minus 0.01. The eligible recipe with the lowest flip rate on ViLexNorm dev goes to
    confirmation; if none is eligible, or neither lowers the dev flip rate below the control's, H10
    is not supported and stops.
  confirmation: the chosen recipe at the four other seeds (5 in all), against the control's 5 seeds
  flip_rate: >
    The share of pairs whose predicted labels differ between the original and the normalized form,
    both through the served pipeline (transform above, then the model).
  rule: >
    All must hold, 5 seeds each side:
    (1) ViLexNorm test flip rate lower: the seed-averaged paired difference (candidate minus control)
        has a 95% paired-bootstrap interval below 0 (pairs resampled, the 5 seed pairs averaged per
        resample, 10,000 resamples);
    (2) UIT-VSFC validation macro-F1, 5-seed mean, not lower by more than 0.005;
    (3) UIT-VSFC validation neutral F1, 5-seed mean, not lower by more than 0.02;
    (4) UIT-VSFC validation with diacritics stripped, through the restorer, macro-F1 5-seed mean not
        lower by more than 0.01;
    (5) NEU-ESC validation (in-scope) macro-F1, 5-seed mean, not lower by more than 0.01.
  reported_not_tested: >
    Flip rate on the pairs whose two forms differ after the transform; which labels flip, in both
    directions; per-class F1 on every set; NEU-ESC validation on all 3,305 posts; the scope
    detector's flag rate on ViLexNorm test (reported, not a condition: ViLexNorm is off-domain).
  serving: >
    If the rule holds, the chosen recipe's seed-42 model is released through the gate with the
    restorer and the scope detector re-accepted, three latency sessions, an ADR and a new card. The
    Hub update needs the owner's approval and the licence decision above.

H11_distilled_student:   # v2
  question: >
    Can a 6-layer student with its weights stored in FP16 serve at <= 200 MB and lose at most 0.01
    macro-F1 against its teacher on UIT-VSFC and NEU-ESC validation, with no batch dependence?
  why: >
    The FP32 graph is 540 MB. INT8 passed non-inferiority but changed 8.6% of labels and depended on
    the batch (ADR-036). Neither 6 layers (370 MB) nor FP16 storage (270 MB) alone reaches 200 MB;
    together they give about 185 MB, every multiplication in FP32 (NEXT_PLAN v6 § 3).
  teacher: >
    If H10 passes (results/studies/cycle5/h10/confirm-<recipe>/decision.json), H10's chosen recipe
    at the five seeds; otherwise the served recipe at the five seeds (p9 s42, p10 others).
  soft_labels: >
    The mean over the five teacher seeds of softmax(logits / 2), computed once per distinct input
    text (training/distill.py, cached by the SHA-1 of the text).
  transfer_set: >
    UIT-VSFC train with gold labels and the served recipe's diac-teen augmentation (p = 0.3, keyed on
    the student's seed), plus unlabeled in-scope NEU-ESC train (21,113 posts) and the ViLexNorm
    consistency-training originals (7,535), all through the serving transform. No validation or test
    text.
  loss: >
    Labelled rows: 0.5 * T^2 * KL(teacher || student at T) + 0.5 * cross-entropy. Unlabeled rows:
    T^2 * KL alone. T = 2.
  students:
    teacher_alternate: >
      The same-seed teacher's embeddings, its layers 1, 3, 5, 7, 9, 11 (the last is the one its
      head reads) and its head.
    pretrained_first6: >
      Pretrained PhoBERT-base at the pinned revision, its first six layers, a new 3-class head.
  training: >
    The served recipe's optimizer and schedule (lr 2e-5, 4 epochs, batch 32, warmup 0.1, AMP,
    clipping 1.0); the epoch by UIT-VSFC validation macro-F1.
  selection: >
    Each student at seed 42. The one with the higher mean of UIT-VSFC validation macro-F1 and NEU-ESC
    validation macro-F1 (all 3,305 posts) goes to confirmation.
  confirmation: the chosen student at the four other seeds, against the teacher's five seeds
  artifact: >
    The seed-42 student exported with its weights stored in FP16 and computed in FP32
    (inference.onnx_export.export_fp16_storage; not passed through the offline optimizer, which
    would fold the casts back to FP32).
  rule: >
    All must hold:
    (1) the FP16-storage graph is <= 200 MB;
    (2) pooled UIT-VSFC validation + NEU-ESC validation (4,888 rows, every topic, the S5' set): the
        seed-averaged macro-F1 drop (teacher minus student) has a one-sided 95% paired-bootstrap
        upper bound <= 0.01 (rows resampled, 10,000 resamples);
    (3) UIT-VSFC validation, 5-seed means: macro-F1 drop <= 0.01, neutral F1 drop <= 0.03, and with
        diacritics stripped, through the restorer, macro-F1 drop <= 0.015;
    (4) the seed-42 graph against the PyTorch student with the same FP16-rounded weights, on UIT-VSFC
        validation: max |logit difference| <= 1e-4 and 100% label agreement; each of 32 rows scored
        alone and inside one padded batch differs by <= 1e-4.
  reported_not_tested: >
    Label agreement between the FP32 student and its FP16-rounded copy; per-class F1; NEU-ESC
    validation in scope; ViLexNorm dev flips; parameter count; model-only latency (indicative).
  serving: >
    If the rule holds, the student is released through the gate with the restorer and the scope
    detector re-accepted and an ADR; three latency sessions on an idle machine must show served p95
    <= 30 ms before it replaces the teacher. Its transfer set holds ViLexNorm text (CC BY-NC-SA 4.0),
    so a Hub upload needs the owner's licence decision (HUONG_DAN_THU_CONG.md § 4) and approval.

H11_release:   # v3
  candidate: >
    The seed-42 student released through the gate as an FP16-storage graph (185.1 MB) with the
    restorer and the scope detector re-accepted, in models/candidate/sentiment.
  latency: >
    The owner waived the idle-machine condition (2026-09-30). Three sessions of
    `study latency --no-torch` on the machine as it is, each timing the served release and then the
    candidate. The candidate replaces the served model if the median over the three sessions of its
    served-pipeline p95 (S1) is <= 30 ms, the C4 protocol. A busy machine only slows the pipeline, so
    the condition is conservative; the range and the within-session ratio to the served release are
    reported.
  closing_gate: >
    Once: the five H11 students (PyTorch) on UIT-VSFC test, and the seed-42 student through the Cycle 1
    closing-gate procedure (test, the overlap-excluded slice, temperature fitted on validation, the four
    robustness suites on test). Every evaluation is appended to results/test_evaluations.log. Reported
    for the model card and S1; no decision depends on it. The teacher's figures are Cycle 1's (5-seed
    mean 0.8296, seed 42 0.8371).

H10b_anchored_consistency:   # v4, before any H10b run
  question: >
    Does training the served 12-layer recipe to give a real comment the label a frozen teacher gives
    its normalized form make real typing change fewer labels, without collapsing the informal
    register onto one class and at no material cost on labelled data?
  why: >
    H10's own-prediction consistency had a constant solution and found it (ADR-038). Here the target
    is fixed and diverse: the 5-seed ensemble of the served recipe (p9 s42, p10 others), frozen, its
    mean softmax on the normalized form.
  data: >
    The 7,535 ViLexNorm training pairs outside the dev split, split once by
    numpy.random.default_rng(43).permutation(7535): the first 1,500 are the confirmation pairs, the
    other 6,035 the training pairs; indices written to results/studies/cycle5/h10b_confirm_index.csv.
    No model in this comparison has trained on the confirmation pairs, and no rule has been evaluated
    on them (H10's models trained on them; they are not part of H10b). The dev split (837) is H10's.
    ViLexNorm test is not used. Text through the serving transform, as in H10.
  control: the served recipe at 5 seeds (the teacher's members), re-evaluated with the same code
  recipes:
    anchored_orig: >
      The served recipe plus, at every step, a same-size batch of training pairs:
      1.0 * KL(q(normalized) || p(original)), q the frozen ensemble's probabilities.
    anchored_both: >
      The same with 1.0 * 0.5 * (KL(q(normalized) || p(original)) + KL(q(normalized) || p(normalized))).
  metrics: >
    agreement: the share of pairs where the model's label on the original equals the ensemble's label
    on the normalized form. flip rate: as H10. label_tv: the total-variation distance between the
    model's label distribution on the originals and the ensemble's on the normalized forms.
  epoch_selection: UIT-VSFC validation macro-F1, as the served recipe
  recipe_selection: >
    Each recipe once at seed 42. Eligible: UIT-VSFC validation within 0.01 of the control's seed 42,
    and dev label_tv <= 0.10. The eligible recipe with the highest dev agreement goes to confirmation
    if that agreement is higher than the control's; otherwise H10b is not supported.
  rule: >
    All must hold, 5 seeds each side, on the 1,500 confirmation pairs (10,000 paired resamples of
    pairs, seed pairs averaged per resample): (1) agreement higher, interval above 0; (2) flip rate
    lower, interval below 0; (3) label_tv, 5-seed mean, <= 0.10; and on validation, 5-seed means:
    (4) UIT-VSFC macro-F1 not lower by more than 0.005; (5) neutral F1 not lower by more than 0.02;
    (6) stripped text through the restorer not lower by more than 0.01; (7) NEU-ESC (in scope) not
    lower by more than 0.01.
  serving: >
    If the rule holds, the seed-42 model is a 12-layer release candidate and a candidate teacher for
    a later student; any release goes through the gate with an ADR. Its weights would carry
    CC BY-NC-SA 4.0 (ViLexNorm).

H10b_release:   # v5
  candidate: >
    The seed-42 anchored_orig model through the release gate as an FP32 graph (the 12-layer
    procedure), with the restorer, the scope detector and a temperature re-accepted, in
    models/candidate/sentiment. It does not replace the served model by itself: decision 9 (the
    student, the 12-layer model, or this one) is the owner's.
  closing_gate: >
    Once: the five H10b models (PyTorch) on UIT-VSFC test, and the seed-42 model through the Cycle 1
    closing-gate procedure. Every evaluation is appended to results/test_evaluations.log. Reported for
    decision 9 and the card, against Cycle 1's figures for the served recipe; no selection uses it.

H12prime_held_out_forum_posts:   # v6, before the split is drawn and before any H12' run
  question: >
    Does the two-heads recipe (ADR-033, the UIT-VSFC head served) trained with H10b's anchored
    consistency raise the served head's macro-F1 on in-scope NEU-ESC forum posts that no model in the
    comparison trained on, with no loss on UIT-VSFC, its neutral class, stripped text or real typing?
  why: >
    H12 needs a labelled sample from a third institution, which does not exist yet. H8's two heads
    lifted in-scope NEU-ESC test by +0.111 but failed on stripped text (-0.0107 against -0.01), and
    NEU-ESC test is spent. H10b's anchored consistency held stripped text (+0.0028) and is served.
  scope_of_the_claim: >
    The held-out posts come from the same forum, institution and annotation as the training posts.
    H12' measures in-distribution gain on NEU-ESC's forum, not transfer to a third institution; that
    claim stays with H12.
  data: >
    In-scope NEU-ESC train (21,113 posts; the topics of cycle4.yaml). Split once, before any run,
    stratified by label: within each label, its rows in loader order are ordered by
    numpy.random.default_rng(44).permutation(n_label), and the first round(3000 * n_label / 21113)
    go to the held-out set (neutral 2,041, negative 583, positive 376: 3,000 posts); the other
    18,113 are training posts. Row indices into the train split are written to
    results/studies/cycle5/h12p_holdout_index.csv (indices only, no text). NEU-ESC validation (3,026
    in-scope posts) for epoch and recipe checks. NEU-ESC test and UIT-VSFC test are not used. Text
    through the serving transform, labels as cycle4.yaml (Toxic -> negative).
  control: >
    The served recipe, H10b anchored_orig, at its five seeds (42, 1337, 2024, 7, 31337), the existing
    checkpoints, re-evaluated with the same code as the candidates. None trained on NEU-ESC.
  recipe:
    two_heads_anchored: >
      H10b's anchored_orig recipe (UIT-VSFC train with the diac-teen augmentation, plus at every step
      a same-size batch of the 6,035 H10b training pairs with 1.0 * KL(q(normalized) || p(original)),
      q the frozen ensemble's probabilities), with H8's two heads: one shared encoder, the UIT-VSFC
      head trained on UIT-VSFC, a NEU-ESC head trained by masked cross-entropy on the 18,113 training
      posts (augmented as in H8); the consistency term on the UIT-VSFC head. The UIT-VSFC head is
      evaluated and would be served, so the service's labels keep UIT-VSFC's policy.
  epoch_selection: >
    The mean of UIT-VSFC validation macro-F1 and in-scope NEU-ESC validation macro-F1, both from the
    UIT-VSFC head (H8's procedure).
  eligibility: >
    The recipe runs once at seed 42. It goes on to the other four seeds only if its UIT-VSFC
    validation macro-F1 is at least the control's seed-42 value minus 0.01 and its in-scope NEU-ESC
    validation macro-F1 is higher than the control's seed-42 value; otherwise H12' is not supported
    and stops.
  rule: >
    All must hold, 5 seeds each side:
    (1) held-out macro-F1 (UIT-VSFC head against NEU-ESC labels) higher: the seed-averaged paired
        difference has a 95% paired-bootstrap interval above 0 (posts resampled, the 5 seed pairs
        averaged per resample, 10,000 resamples);
    (2) UIT-VSFC validation macro-F1, 5-seed mean, not lower by more than 0.005;
    (3) UIT-VSFC validation neutral F1, 5-seed mean, not lower by more than 0.02;
    (4) UIT-VSFC validation with diacritics stripped, through the restorer, macro-F1 5-seed mean not
        lower by more than 0.01;
    (5) on H10b's 1,500 confirmation pairs (their second use, as a guard): agreement with the frozen
        teacher, 5-seed mean, not lower by more than 0.02, and label_tv, 5-seed mean, <= 0.10.
  reported_not_tested: >
    In-scope NEU-ESC validation; held-out per class and per topic; the NEU-ESC head on the held-out
    posts; flip rate on the confirmation pairs; the scope detector's flag rate on the held-out posts
    (it was fitted on NEU-ESC train, these posts included, so no scope condition is set).
  serving: >
    If the rule holds, the seed-42 model's UIT-VSFC head goes through the release gate as an FP32
    graph with the restorer, the scope detector and a temperature re-accepted, and through the closing
    gate on UIT-VSFC test once (logged), as H10b. Replacing the served model is the owner's decision.
    Its weights would carry CC BY-NC-SA 4.0 (ViLexNorm); NEU-ESC is used with attribution (owner,
    2026-09-28).

S7b_trimmed_vocabulary:   # v7, before any trimmed graph exists
  question: >
    Can the served H10b model (seed 42) serve under 200 MB, with no retraining, by storing its weights
    in FP16 (computed in FP32) and keeping only the vocabulary pieces its input is expected to use,
    while agreeing with the served FP32 graph on at least 99% of labels on every held-out set?
  why: >
    S7 is met by the released student (ADR-040) but not by the served model (540 MB, ADR-043). FP16
    storage alone gives 270 MB with 100% agreement (F4). The word-embedding matrix is 64,001 x 768,
    about 98 MB in FP16; the training texts use 15,566 of its pieces.
  vocabulary: >
    The four special tokens, <mask>, and every vocab.txt piece that the PhoBERT tokenizer produces on:
    UIT-VSFC train as materialized (seg_pyvi), its fully stripped form (strip_diacritics) and its
    teencode-100 form (evaluation.robustness, seed 42); NEU-ESC train, all 23,048 posts, through the
    serving transform; and H10b's 6,035 ViLexNorm training pairs, both forms, through the serving
    transform. Then the most frequent remaining pieces by vocab.txt's pretraining counts, until the
    vocabulary holds 17,500 entries. Pieces keep their vocab.txt order; a piece outside the vocabulary
    becomes <unk>, as any unknown piece does today.
  artifact: >
    The seed-42 H10b checkpoint with its word-embedding rows sliced to the vocabulary (no other weight
    changes), exported as an FP16-storage graph through the release gate (`--quantize fp16-storage`),
    with the restorer, the scope detector and a temperature fitted on validation re-accepted, in
    models/candidate/sentiment.
  held_out: >
    None of these texts is in the vocabulary source: UIT-VSFC validation (as segmented) and the same
    with diacritics stripped, through the restorer; NEU-ESC validation, all 3,305 posts, through the
    serving transform; ViLexNorm dev (837) and H10b's confirmation pairs (1,500), each form; the 285
    labelled rows of challenge v1, through the served pipeline.
  rule: >
    All must hold: (1) the graph file is <= 200 MB (10^6 bytes); (2) the release gate passes in
    fp16-storage mode (logits against the FP16-rounded trimmed model, label agreement, batch
    independence); (3) label agreement with the served FP32 H10b graph >= 99% on each held-out set;
    (4) UIT-VSFC validation macro-F1 and NEU-ESC validation macro-F1 each within 0.005 of the FP32
    graph's.
  reported_not_tested: >
    The share of pieces and of texts that meet a removed piece, per held-out set; per-class F1; flip
    rate on the ViLexNorm pairs; graph size.
  serving: >
    If the rule holds, the candidate replaces the FP32 graph once one latency session has a steady
    served-pipeline pass with p95 <= 30 ms (the owner waived the idle condition); the FP32 graph is
    kept as models/serve/.fp32-sentiment. Then the trimmed graph is scored on UIT-VSFC test once,
    logged, for the model card; no decision depends on it. A Hub update needs the owner's approval.

planned:   # outlines only; nothing here is a rule until a later version declares it
  H12_other_institutions: >
    The two-heads design of ADR-033 with H10's objective, confirmed on a new human-labelled sample
    from another institution (>= 600 in-scope posts, two annotators).
  cycle5_closing_gate: >
    After the last release of the cycle, the released model(s) on UIT-VSFC test once, logged in
    results/test_evaluations.log, as Cycle 1's closing gate (S1 is re-measured there, not chased).

budget:
  weight_updating_runs: 23       # H10: 2 + 4; H11: 2 + 4 (v2); H10b: 2 + 4 (v4); H12': 1 + 4 (v6); S7b: none
  gpu_hours_estimate: {laptop_rtx3050: 7}  # plus H11's five teacher inference passes; H12' about 3
  api_usd: 0
