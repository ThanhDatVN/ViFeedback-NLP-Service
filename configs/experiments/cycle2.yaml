# Cycle 2 — declared 2026-09-27, before any Cycle 2 run and before the challenge set is evaluated.
#
# Follows docs/NEXT_PLAN.md. Track A (encoder vs LLM) is chosen, as NEXT_PLAN recommends for an
# AI-engineer profile; track B (distillation / careful INT8) stays available for a later cycle.
# Changing a rule below after results are seen requires a new file version and an ADR.
#
# Version 2 (ADR-026), committed before any model is evaluated on the challenge set and before any
# H7 run: freezes challenge_set_v1 by hash, adds an API reference arm to H7, and adds two descriptive
# measurements. No v1 rule is changed; H5 is running and its rule is untouched.
#
# Version 3 (2026-10-01, ADR-044), before any audit annotation exists: the audit may annotate the
# rows the tree reads alone (audit_scope_first). The tree, its scope and its thresholds are unchanged.

version: 3
declared: 2026-09-27
revised: 2026-10-01  # v3 audit_scope_first
track: A
budget:
  weight_updating_runs: 5           # H5: five topic OOF folds. LLM work is inference only.
  gpu_hours_estimate: {laptop_rtx3050: 1.5, kaggle_t4: 3}

evaluation_data:
  challenge_set_v1:
    path: data/challenge/challenge_v1.csv
    sha256: c4879de4ea7a6a23007358f12657cd0feaab4b499fec5834eafb2d18ab5b4a39  # LF line endings, as stored in git (.gitattributes)
    rows: 305            # 285 labelled positive/negative/neutral + 20 out_of_scope (label "none")
    read_with: pandas keep_default_na=False
    authored_by: project author (constructed; not drawn from UIT-VSFC), labelled under docs/ANNOTATION_GUIDE.md
    freeze: >
      Frozen by the sha256 above. No row is edited; corrections go to challenge_v2, and any v2 result
      is reported next to v1, never instead of it.
    categories: [negation_pair, mixed_aspect, suggestion_cue, suggestion_implicit, unaccented_typed,
                 teencode_typed, code_switch, long_context, objective_neutral, out_of_scope]
    scored_rows: >
      Sentiment accuracy and F1 use the 285 labelled rows. out_of_scope rows are never scored; they
      feed the descriptive confidence measurement below. mixed_aspect is always also reported alone,
      because its contrast-clause policy is the least certain in the set (data/challenge/README.md).
    note: >
      "typed" rows are written as a person types them, not produced by the perturbation code, so they
      test H2's augmentation on noise it was not built from.
  official_test: historical comparison only; no Cycle 2 decision uses it.

hypotheses:
  H5_topic_stacking:
    question: Do sparse and dense topic predictions carry complementary information? (E08, NEXT_PLAN step 4)
    evidence: TF-IDF beats PhoBERT on facility (0.921 vs 0.905, dev).
    method: >
      5 stratified folds over train (seed 42). Per fold: PhoBERT-base + pyvi topic model (base recipe)
      and TF-IDF B4 (union features, LinearSVC, C fixed at 1.0, no dev selection) fitted on the other
      4 folds; out-of-fold PhoBERT probabilities and B4 decision scores on the held-out fold. A
      multinomial logistic regression meta-model is fitted on the OOF features only.
      Validation features: PhoBERT = mean of the 5 fold models' probabilities; B4 refitted on all of
      train.
    comparison: stacked vs PhoBERT fold-ensemble alone, same examples, paired bootstrap over examples
    supported_if: >
      topic macro-F1 gain >= +0.005 with the 95% paired CI above 0, AND facility and others F1 not
      lower than PhoBERT alone.
    descriptive: >
      (v2) The facility claim itself (TF-IDF 0.921 vs PhoBERT 0.905 on dev, one model each) gets a
      paired example bootstrap from the same validation predictions. Reported; decides nothing.

  H6_serving_model:
    question: Should the service switch to the H2-augmented model? (NEXT_PLAN step 0.3)
    evidence: H2 supported on validation (5 seeds) and confirmed on test (clean +0.0008; no-diacritic 0.27 -> 0.64).
    comparison: seed-42 CE checkpoint vs seed-42 augmented checkpoint on challenge_set_v1
    switch_if: >
      On unaccented_typed + teencode_typed rows the augmented model's accuracy exceeds CE's with a
      paired 95% CI above 0, AND on all other rows its accuracy is not lower by more than 0.02.
      Otherwise the service keeps the CE model.
    logged_as: a decision influenced by test results (EVALUATION_PROTOCOL § 4), because the test gate is part of its evidence

  H7_llm_reference:
    question: Where the encoder is weakest (neutral, mixed aspects, suggestions), does an instruction-tuned LLM do better, and at what cost? (Study E)
    models:
      pilot: Qwen/Qwen3-1.7B, laptop fp16, to validate the pipeline; reported, but not the declared result
      declared: Qwen/Qwen3-4B, Kaggle T4 fp16
      api_reference: >
        (v2) gpt-4o-mini, snapshot gpt-4o-mini-2024-07-18, temperature 0, via the OpenAI API with the
        owner's key read from the environment (OPENAI_API_KEY), never written to any file in the repo.
        A closed model: reported as a reference point, not a deployable candidate.
      revisions: pinned to the Hub commit at run time and recorded in the output
    prompting: >
      Label definitions from the annotation guide, thinking disabled. Zero-shot, and few-shot with 6
      demonstrations (2 per class) drawn from train with seeds 1 and 2. Prompt development: at most 4
      variants, scored on a fixed stratified 200-example train subset; the best by macro-F1 is frozen.
      Validation and the challenge set are never used for prompt development.
      (v2) Prompt development uses the pilot model only. The frozen prompt is reused unchanged for
      Qwen3-4B and the API arm.
    data_egress: >
      (v2) Only data the project may send to a third party goes to the API. challenge_set_v1 is
      constructed by the project, so it may. UIT-VSFC text (validation, and train demonstrations for
      few-shot) goes to the API only after the owner confirms the dataset's licence allows it. Until
      then the API arm runs zero-shot on challenge_set_v1 only, and this is stated with its result.
    scoring: >
      Label likelihood: the summed log-probability of each label's tokens after the prompt. Outputs
      are valid by construction and come with probabilities. Labels are the English words positive,
      negative, neutral. (v2) API arm: the answer is one token; its top-20 log-probabilities are
      read, and a label absent from them gets the smallest returned log-probability minus 1.
    comparison: paired per example against the seed-42 CE encoder, on validation and challenge_set_v1
    report: [per-class P/R/F1, macro-F1, neutral F1, latency per sentence, GPU-seconds per 1k sentences,
             (v2) USD per 1k sentences for the API arm, with network latency reported as such]
    outcomes:
      multiplicity: (v2) two declared comparisons, Qwen3-4B and the API arm, each against the encoder; Holm over the two
      llm_better_on_neutral: >
        An LLM's neutral F1 on challenge_set_v1 above the encoder's with a paired 95% CI above 0 (Holm-adjusted):
        routing (encoder first, LLM on low-confidence predictions) becomes Cycle 3's question.
      encoder_better_or_equal: report cost-adjusted; the fine-tuned encoder is the answer at this budget.
    caveat: pretraining contamination of UIT-VSFC is unknown for a public LLM; the challenge set is the cleaner comparison.

descriptive_v2:
  out_of_scope_confidence: >
    Max softmax probability of the served model on the 20 out_of_scope rows vs the 30
    objective_neutral rows (the encoder has no abstain class). Answers a documented limitation
    (RESEARCH_REPORT § 7: out-of-scope input untested); decides nothing.

audit_decision_tree:   # NEXT_PLAN step 1; frozen here before any annotation is done
  scope: confident neutral-error strata of results/studies/study_a/audit_sample_index.csv
  rules:
    - {if: "share of 'incorrect' gold >= 0.30", then: "E04: train-label correction, 2x2 (labels x recipe), 3 seeds"}
    - {if: "share of 'ambiguous' gold >= 0.40", then: "policy ceiling: one soft-label run, then stop optimizing neutral on this benchmark"}
    - {else: "representation: raw-text or social-domain encoder (BamiBERT / ViSoBERT) or TAPT"}
  agreement: Cohen's kappa on >= 50 rows including all 40 random rows (inter-annotator, or intra after >= 24 h, labelled as such)

audit_scope_first:   # v3, ADR-044; before any annotation exists
  why: >
    The tree reads only its scope, the confident neutral-error strata: 58 of the 160 rows. Annotating
    them first gives the branch from human labels alone, in about a third of the time. The other 102
    rows estimate corpus-level rates; they may be annotated later, and nothing above depends on them.
  sheet: >
    `study audit-scope-sheet`: the 58 rows in the order numpy.random.default_rng(45).permutation(58)
    (a second pass uses 46), the columns to hide during the blind pass placed after `notes`. The same
    guide and the same two steps: blind label and subtype, then the gold assessment.
  report: "`study audit-report --scope-only`: per stratum and the tree, on the 58 rows"
  agreement: >
    For this route, Cohen's kappa on the 58 rows: a second blind pass by the same person at least
    24 h later (intra, labelled as such) or by a second person (inter). No corpus-level rate is
    reported unless the random stratum is annotated too.
  llm: no LLM output enters the annotation or the decision.

