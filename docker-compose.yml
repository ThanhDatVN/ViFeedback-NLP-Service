services:
  api:
    build: .
    image: vifeedback:latest
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /app/models/serve
      MAX_LENGTH: "96"      # Gate G0 decision: PhoBERT subword p99.9 = 87
      SEGMENTER: pyvi       # ADR-012: +0.023 macro-F1 for 0.31 ms p95, no JVM
      ORT_THREADS: "2"
      LOG_LEVEL: INFO
    volumes:
      # Read-only: the service must never be able to modify the artifact it is serving.
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8000/readyz',timeout=4)).get('ready') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
