# Runs the same checks CI does, before the commit rather than after.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]   # a checkpoint must never reach git; see models/README.md
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: no-ignored-sources
        name: no source file is excluded by .gitignore
        entry: python -m pytest tests/unit/test_packaging.py -q
        language: system
        pass_filenames: false
        # Guards the incident where a bare `models/` pattern silently excluded
        # src/vifeedback/models/ from every commit and shipped a broken package.
